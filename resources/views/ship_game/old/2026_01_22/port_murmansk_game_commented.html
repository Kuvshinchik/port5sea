    // Создание фонового прямоугольника с градиентом
    const bg = scene.add.graphics(); // Создание графического объекта
    bg.fillGradientStyle(0x1a2a3a, 0x1a2a3a, 0x0d1b2a, 0x1b263b, 1); // Установка градиента
    bg.fillRect(0, 0, 1200, 800); // Рисование прямоугольника
    
    // Добавление эффекта воды (волны)
    for (let i = 0; i < 5; i++) { // Цикл для создания 5 волн
        const wave = scene.add.graphics(); // Создание графического объекта для волны
        wave.lineStyle(2, 0x2c3e50, 0.3); // Установка стиля линии (толщина, цвет, прозрачность)
        wave.beginPath(); // Начало пути для рисования
        wave.moveTo(0, 650 + i * 30); // Перемещение к начальной точке
        
        for (let x = 0; x < 1200; x += 50) { // Цикл для создания волнообразной формы
            wave.lineTo(x, 650 + i * 30 + Math.sin(x * 0.02) * 10); // Рисование линии с синусоидальным изгибом
        }
        
        wave.strokePath(); // Отрисовка пути
        
        // Анимация волны (движение вверх-вниз)
        scene.tweens.add({ // Создание анимации
            targets: wave, // Объект для анимации
            y: -5, // Конечное значение Y координаты
            duration: 2000 + i * 500, // Длительность анимации в миллисекундах
            yoyo: true, // Возврат к исходному значению
            repeat: -1, // Бесконечное повторение
            ease: 'Sine.easeInOut' // Функция плавности анимации
        });
    }
    
    // ═══════════════════════════════════════════════════════════════════════
    // ЗДАНИЯ ПОРТА - создание интерактивных зданий
    // ═══════════════════════════════════════════════════════════════════════
    
    // Позиции зданий на экране
    const buildingPositions = [ // Массив с координатами зданий

        { x: 640, y: 360, width: 180, height: 190, color: 0x27ae60, label: '🍞 ПРОДУКТЫ\nПИТАНИЯ', action: () => openFoodModal(scene) },
        { x: 860, y: 340, width: 180, height: 210, color: 0x9b59b6, label: '📋 ДОСКА\nОБЪЯВЛЕНИЙ', action: () => openJobsModal(scene) }
    ];
    
    buildingPositions.forEach(building => { // Цикл по каждому зданию

        shadow.fillRoundedRect(5, 5, building.width, building.height, 15); // Рисование закругленного прямоугольника для тени
        container.add(shadow); // Добавление тени в контейнер
        
        // Основное здание
        const buildingRect = scene.add.graphics(); // Создание графического объекта для здания
        buildingRect.fillStyle(building.color, 1); // Установка цвета здания
        buildingRect.fillRoundedRect(0, 0, building.width, building.height, 15); // Рисование здания
        buildingRect.lineStyle(3, darkenColor(building.color, 30), 1); // Установка границы здания
        buildingRect.strokeRoundedRect(0, 0, building.width, building.height, 15); // Отрисовка границы
        container.add(buildingRect); // Добавление здания в контейнер
        
        // Окна на здании
        for (let row = 0; row < 3; row++) { // Цикл по рядам окон
            for (let col = 0; col < 2; col++) { // Цикл по колонкам окон
                const window = scene.add.graphics(); // Создание графического объекта для окна
                window.fillStyle(0xffffff, 0.7); // Установка цвета окна (белый с прозрачностью)
                window.fillRect(30 + col * 60, 40 + row * 50, 40, 35); // Рисование окна
                container.add(window); // Добавление окна в контейнер
            }
        }
        
        // Крыша здания
        const roof = scene.add.graphics(); // Создание графического объекта для крыши
        roof.fillStyle(darkenColor(building.color, 40), 1); // Установка цвета крыши (темнее основного)
        roof.fillTriangle(0, 0, building.width / 2, -30, building.width, 0); // Рисование треугольной крыши
        container.add(roof); // Добавление крыши в контейнер
        
        // Текст на здании
        const label = scene.add.text(building.width / 2, building.height / 2, building.label, { // Создание текстового объекта

        hitArea.setInteractive({ useHandCursor: true }); // Установка интерактивности с курсором-рукой
        container.add(hitArea); // Добавление в контейнер
        
        // Эффект при наведении мыши

            scene.tweens.add({ // Создание анимации возврата

                duration: 200,

    // ═══════════════════════════════════════════════════════════════════════

    cabin.fillStyle(0x34495e, 1); // Установка серого цвета
    cabin.fillRoundedRect(-60, -70, 120, 40, 8); // Рисование рубки

    // Труба корабля

        const window = scene.add.graphics(); // Создание графического объекта для окна
        window.fillStyle(0x3498db, 0.8); // Установка голубого цвета
        window.fillRect(-40 + i * 30, -60, 20, 15); // Рисование окна
        ship.add(window); // Добавление окна в контейнер

    // Якорь
    const anchor = scene.add.text(-90, -20, '⚓', { // Создание текстового объекта с эмодзи якоря
        fontSize: '32px' // Размер шрифта
    });
    ship.add(anchor); // Добавление якоря в контейнер
    
    // Флаг России

        fontSize: '28px'
    });
    ship.add(flag); // Добавление флага в контейнер
    
    // Анимация покачивания флага
    scene.tweens.add({ // Создание анимации
        targets: flag, // Анимируемый объект
        angle: -10, // Поворот на -10 градусов
        duration: 1000, // Длительность
        yoyo: true, // Возврат обратно
        repeat: -1, // Бесконечное повторение
        ease: 'Sine.easeInOut' // Функция плавности
    });
    
    // Анимация покачивания корабля на волнах
    scene.tweens.add({ // Создание анимации
        targets: ship, // Анимируемый объект
        y: 590, // Конечная Y координата
        duration: 3000, // Длительность 3 секунды
        yoyo: true, // Возврат обратно
        repeat: -1, // Бесконечное повторение
        ease: 'Sine.easeInOut' // Плавное движение
    });

    btnBg.fillStyle(0x27ae60, 1); // Установка зеленого цвета
    btnBg.fillRoundedRect(-100, -25, 200, 50, 15); // Рисование закругленного прямоугольника
    btnBg.lineStyle(3, 0x1e8449, 1); // Установка границы
    btnBg.strokeRoundedRect(-100, -25, 200, 50, 15); // Отрисовка границы
    departButton.add(btnBg); // Добавление фона в контейнер кнопки
    
    const btnText = scene.add.text(0, 0, '⛵ Отправиться\nв путь', { // Создание текста кнопки
        fontSize: '16px', // Размер шрифта
        fontFamily: 'Russo One, Arial', // Семейство шрифтов

        scene.tweens.add({ // Создание анимации
            targets: departButton,

        });
    });

        scene.tweens.add({ // Создание анимации возврата
            targets: departButton,
            scaleX: 1,
            scaleY: 1,
            duration: 200,
            ease: 'Back.easeIn'

    ship.add(departButton); // Добавление кнопки в контейнер корабля
    
    // ═══════════════════════════════════════════════════════════════════════
    // ПАНЕЛЬ СТАТУСА - отображение текущих ресурсов игрока

    panelBg.fillStyle(0x1a252f, 0.9); // Темный полупрозрачный фон

    statusPanel.add(panelBg); // Добавление фона в контейнер
    
    // Текстовые элементы статуса
    const statusTexts = { // Объект для хранения ссылок на текстовые элементы
        money: scene.add.text(-520, 0, '', { fontSize: '18px', fontFamily: 'Nunito, Arial', color: '#ffffff', fontStyle: 'bold' }),
        crew: scene.add.text(-220, 0, '', { fontSize: '18px', fontFamily: 'Nunito, Arial', color: '#ffffff', fontStyle: 'bold' }),
        food: scene.add.text(50, 0, '', { fontSize: '18px', fontFamily: 'Nunito, Arial', color: '#ffffff', fontStyle: 'bold' }),
        cargo: scene.add.text(280, 0, '', { fontSize: '18px', fontFamily: 'Nunito, Arial', color: '#ffffff', fontStyle: 'bold' })
    };
    
    // Установка точки привязки для каждого текста
    Object.values(statusTexts).forEach(text => text.setOrigin(0, 0.5));
    
    // Добавление всех текстов в контейнер
    Object.values(statusTexts).forEach(text => statusPanel.add(text));
    
    // Функция обновления статуса
    function updateStatus() { // Функция для обновления текста на панели статуса
        statusTexts.money.setText(`💰 ${formatMoney(gameState.money)}`); // Обновление отображения денег
        statusTexts.crew.setText(`👥 ${gameState.crew.length}/${GAME_DATA.maxCrew}`); // Обновление отображения экипажа
        statusTexts.food.setText(`🍞 ${gameState.foodDays} дней`); // Обновление отображения продовольствия
        statusTexts.cargo.setText(`⚖️ ${gameState.cargoUsed}/${GAME_DATA.maxCargoCapacity} кг`); // Обновление отображения груза
    }
    
    updateStatus(); // Первоначальное обновление статуса
    
    // Сохранение функции обновления в контекст сцены для доступа из других функций
    scene.updateStatus = updateStatus;
}

// МОДАЛЬНЫЕ ОКНА - создание всплывающих окон
// ═══════════════════════════════════════════════════════════════════════════

function createModal(scene, title, width, height) { // Функция создания базового модального окна
    // Затемнение фона
    const overlay = scene.add.graphics(); // Создание графического объекта для затемнения
    overlay.fillStyle(0x000000, 0.7); // Черный полупрозрачный цвет
    overlay.fillRect(0, 0, 1200, 800); // Рисование на весь экран
    overlay.setInteractive(new Phaser.Geom.Rectangle(0, 0, 1200, 800), Phaser.Geom.Rectangle.Contains); // Установка интерактивности для блокировки кликов под окном
    overlay.setDepth(1500); // Установка глубины выше остальных элементов
    
    // Контейнер для модального окна
    const modal = scene.add.container(600, 400); // Создание контейнера в центре экрана
    modal.setDepth(2000); // Установка еще большей глубины
    
    // Фон модального окна
    const bg = scene.add.graphics(); // Создание графического объекта
    bg.fillStyle(0x1a252f, 1); // Темный фон
    bg.fillRoundedRect(-width / 2, -height / 2, width, height, 20); // Рисование закругленного прямоугольника
    bg.lineStyle(3, 0x4fc3f7, 1); // Голубая граница
    bg.strokeRoundedRect(-width / 2, -height / 2, width, height, 20); // Отрисовка границы
    modal.add(bg); // Добавление фона в контейнер
    
    // Заголовок модального окна
    const titleText = scene.add.text(0, -height / 2 + 30, title, { // Создание текста заголовка
        fontSize: '24px', // Размер шрифта
        fontFamily: 'Russo One, Arial', // Семейство шрифтов
        color: '#4fc3f7', // Голубой цвет
        fontStyle: 'bold' // Жирный стиль
    });
    titleText.setOrigin(0.5); // Центрирование
    modal.add(titleText); // Добавление заголовка в контейнер
    
    // Кнопка закрытия (крестик)
    const closeBtn = scene.add.text(width / 2 - 40, -height / 2 + 25, '✖', { // Создание текста крестика
        fontSize: '24px',
        color: '#e74c3c' // Красный цвет
    });
    closeBtn.setInteractive({ useHandCursor: true }); // Установка интерактивности
    closeBtn.on('pointerdown', () => closeModal(scene, modal, overlay)); // При клике закрываем окно
    modal.add(closeBtn); // Добавление крестика в контейнер
    
    // Анимация появления
    modal.setAlpha(0); // Установка начальной прозрачности
    modal.setScale(0.8); // Установка начального масштаба
    scene.tweens.add({ // Создание анимации появления
        targets: modal, // Анимируемый объект
        alpha: 1, // Конечная прозрачность
        scaleX: 1, // Конечный масштаб X
        scaleY: 1, // Конечный масштаб Y
        duration: 300, // Длительность
        ease: 'Back.easeOut' // Функция плавности
    });
    
    // Сохранение ссылки на overlay в модале для последующего удаления
    modal.overlay = overlay;
    
    return modal; // Возврат созданного модального окна
}

function closeModal(scene, modal, overlay = null) { // Функция закрытия модального окна
    if (!modal || !modal.scene) return; // Проверка существования модального окна
    
    scene.tweens.add({ // Создание анимации исчезновения
        targets: modal, // Анимируемый объект
        alpha: 0, // Конечная прозрачность
        scaleX: 0.8, // Конечный масштаб X
        scaleY: 0.8, // Конечный масштаб Y
        duration: 200, // Длительность
        ease: 'Back.easeIn', // Функция плавности
        onComplete: () => { // Функция, вызываемая после завершения анимации
            modal.destroy(); // Уничтожение модального окна
            if (overlay) overlay.destroy(); // Уничтожение затемнения, если оно передано
            if (modal.overlay) modal.overlay.destroy(); // Уничтожение затемнения из свойства модала
            currentModal = null; // Сброс текущего модального окна
        }
    });
}

// ОКНО НАЙМА ЭКИПАЖА
// ═══════════════════════════════════════════════════════════════════════════

function openCrewModal(scene) { // Функция открытия окна найма экипажа
    const modal = createModal(scene, '👥 НАБОР ЭКИПАЖА', 900, 650); // Создание модального окна
    currentModal = modal; // Сохранение ссылки на текущее окно
    
    // Разделение экипажа на обязательных и необязательных
    const requiredCrew = GAME_DATA.crew.filter(m => m.required); // Фильтрация обязательных членов
    const optionalCrew = GAME_DATA.crew.filter(m => !m.required); // Фильтрация необязательных членов
    
    let yOffset = -250; // Начальное смещение по Y для размещения карточек
    
    // Заголовок обязательного экипажа
    const requiredTitle = scene.add.text(-400, yOffset, '⚠️ ОБЯЗАТЕЛЬНЫЕ:', { // Создание текста заголовка
        fontSize: '16px',
        fontFamily: 'Russo One, Arial',
        color: '#e74c3c' // Красный цвет
    });
    modal.add(requiredTitle); // Добавление заголовка в модальное окно
    yOffset += 35; // Увеличение смещения
    
    // Карточки обязательных членов экипажа
    requiredCrew.forEach((member, index) => { // Цикл по каждому обязательному члену
        const card = createCrewCard(scene, member, -400 + (index % 2) * 380, yOffset + Math.floor(index / 2) * 150); // Создание карточки
        modal.add(card); // Добавление карточки в модальное окно
    });
    
    yOffset += Math.ceil(requiredCrew.length / 2) * 150 + 20; // Обновление смещения после обязательного экипажа
    
    // Заголовок дополнительного экипажа
    const optionalTitle = scene.add.text(-400, yOffset, '💼 ДОПОЛНИТЕЛЬНЫЕ:', { // Создание текста заголовка
        fontSize: '16px',
        fontFamily: 'Russo One, Arial',
        color: '#4fc3f7' // Голубой цвет
    });
    modal.add(optionalTitle); // Добавление заголовка в модальное окно
    yOffset += 35; // Увеличение смещения
    
    // Карточки дополнительных членов экипажа
    optionalCrew.forEach((member, index) => { // Цикл по каждому дополнительному члену
        const card = createCrewCard(scene, member, -400 + (index % 2) * 380, yOffset + Math.floor(index / 2) * 150); // Создание карточки
        modal.add(card); // Добавление карточки в модальное окно
    });
}

function createCrewCard(scene, member, x, y) { // Функция создания карточки члена экипажа
    const card = scene.add.container(x, y); // Создание контейнера для карточки
    
    const isHired = gameState.crew.includes(member.id); // Проверка, нанят ли член экипажа
    const bgColor = isHired ? 0x27ae60 : parseInt(member.portrait.replace('#', '0x')); // Определение цвета фона (зеленый если нанят)
    
    // Фон карточки
    const bg = scene.add.graphics(); // Создание графического объекта
    bg.fillStyle(bgColor, 1); // Установка цвета фона
    bg.fillRoundedRect(0, 0, 350, 120, 10); // Рисование закругленного прямоугольника
    bg.lineStyle(2, darkenColor(bgColor, 30), 1); // Установка границы
    bg.strokeRoundedRect(0, 0, 350, 120, 10); // Отрисовка границы
    card.add(bg); // Добавление фона в контейнер
    
    // Иконка роли
    const icon = scene.add.text(20, 15, member.roleIcon, { fontSize: '40px' }); // Создание текста с эмодзи
    card.add(icon); // Добавление иконки в контейнер
    
    // Имя и роль
    const name = scene.add.text(80, 20, member.name, { // Создание текста с именем
        fontSize: '18px',
        fontFamily: 'Russo One, Arial',
        color: '#ffffff',
        fontStyle: 'bold'
    });
    card.add(name); // Добавление имени в контейнер
    
    const role = scene.add.text(80, 45, member.role, { // Создание текста с ролью
        fontSize: '14px',
        fontFamily: 'Nunito, Arial',
        color: '#ecf0f1'
    });
    card.add(role); // Добавление роли в контейнер
    
    // Особая черта
    const trait = scene.add.text(80, 70, `${member.trait} (${member.traitEffect})`, { // Создание текста с чертой
        fontSize: '12px',
        fontFamily: 'Nunito, Arial',
        color: '#f39c12'
    });
    card.add(trait); // Добавление черты в контейнер
    
    // Зарплата
    const salary = scene.add.text(80, 95, `💰 ${formatMoney(member.salary)}`, { // Создание текста с зарплатой
        fontSize: '14px',
        fontFamily: 'Nunito, Arial',
        color: '#ffffff',
        fontStyle: 'bold'
    });
    card.add(salary); // Добавление зарплаты в контейнер
    
    // Кнопка найма/увольнения
    const buttonText = isHired ? '❌ Уволить' : '✅ Нанять'; // Определение текста кнопки
    const buttonColor = isHired ? 0xe74c3c : 0x27ae60; // Определение цвета кнопки
    
    const btn = scene.add.graphics(); // Создание графического объекта для кнопки
    btn.fillStyle(buttonColor, 1); // Установка цвета
    btn.fillRoundedRect(240, 40, 90, 40, 8); // Рисование кнопки
    card.add(btn); // Добавление кнопки в контейнер
    
    const btnText = scene.add.text(285, 60, buttonText, { // Создание текста на кнопке
        fontSize: '14px',
        fontFamily: 'Nunito, Arial',
        color: '#ffffff',
        fontStyle: 'bold'
    });
    btnText.setOrigin(0.5); // Центрирование текста
    card.add(btnText); // Добавление текста в контейнер
    
    // Интерактивная область для кнопки
    const btnHit = scene.add.rectangle(285, 60, 90, 40, 0xffffff, 0); // Создание невидимой области
    btnHit.setInteractive({ useHandCursor: true }); // Установка интерактивности
    btnHit.on('pointerdown', () => toggleCrewMember(scene, member)); // При клике переключаем состояние найма
    card.add(btnHit); // Добавление области в контейнер
    
    return card; // Возврат созданной карточки
}

function toggleCrewMember(scene, member) { // Функция переключения состояния найма члена экипажа
    const isHired = gameState.crew.includes(member.id); // Проверка текущего состояния
    
    if (isHired) { // Если уже нанят
        gameState.crew = gameState.crew.filter(id => id !== member.id); // Удаляем из экипажа
        gameState.money += member.salary; // Возвращаем зарплату
        showNotification(scene, `❌ ${member.name} уволен`, '#e74c3c'); // Показываем уведомление
        showMoneyAnimation(scene, member.salary, true); // Анимация получения денег
    } else { // Если не нанят
        if (gameState.crew.length >= GAME_DATA.maxCrew) { // Проверка лимита экипажа
            showNotification(scene, '❌ Достигнут лимит экипажа!', '#e74c3c'); // Показываем сообщение об ошибке
            return; // Выход из функции
        }
        
        if (gameState.money < member.salary) { // Проверка достаточности денег
            showNotification(scene, '❌ Недостаточно денег!', '#e74c3c'); // Показываем сообщение об ошибке
            return; // Выход из функции
        }
        
        gameState.crew.push(member.id); // Добавляем в экипаж
        gameState.money -= member.salary; // Вычитаем зарплату
        showNotification(scene, `✅ ${member.name} нанят!`, '#27ae60'); // Показываем уведомление
        showMoneyAnimation(scene, member.salary, false); // Анимация потери денег
    }
    
    scene.updateStatus(); // Обновляем панель статуса
    
    // Перерисовываем окно
    closeModal(scene, currentModal); // Закрываем текущее окно
    setTimeout(() => openCrewModal(scene), 200); // Открываем новое окно через небольшую задержку
}

function openEquipmentModal(scene) { // Функция открытия окна покупки снаряжения

    GAME_DATA.equipment.forEach((item, index) => { // Цикл по каждому предмету снаряжения

}

function createEquipmentCard(scene, item, x, y) { // Функция создания карточки снаряжения

    bg.fillRoundedRect(0, 0, 350, 110, 10); // Рисование прямоугольника
    bg.lineStyle(2, darkenColor(bgColor, 30), 1); // Установка границы
    bg.strokeRoundedRect(0, 0, 350, 110, 10); // Отрисовка границы
    card.add(bg); // Добавление фона в контейнер
    
    // Иконка
    const icon = scene.add.text(20, 15, item.icon, { fontSize: '36px' }); // Создание текста с эмодзи
    card.add(icon); // Добавление иконки в контейнер
    
    // Название
    const name = scene.add.text(80, 15, item.name, { // Создание текста с названием
        fontSize: '16px',
        fontFamily: 'Russo One, Arial',
        color: '#ffffff',
        fontStyle: 'bold'
    });
    card.add(name); // Добавление названия в контейнер
    
    // Описание
    const desc = scene.add.text(80, 40, item.description, { // Создание текста с описанием
        fontSize: '12px',
        fontFamily: 'Nunito, Arial',
        color: '#ecf0f1',
        wordWrap: { width: 250 } // Перенос текста по словам
    });
    card.add(desc); // Добавление описания в контейнер
    
    // Эффект
    const effect = scene.add.text(80, 70, `⚡ ${item.effect}`, { // Создание текста с эффектом
        fontSize: '11px',
        fontFamily: 'Nunito, Arial',
        color: '#f39c12',
        fontStyle: 'bold'
    });
    card.add(effect); // Добавление эффекта в контейнер
    
    // Цена
    const price = scene.add.text(80, 90, `💰 ${formatMoney(item.price)}`, { // Создание текста с ценой
        fontSize: '13px',
        fontFamily: 'Nunito, Arial',
        color: '#ffffff',
        fontStyle: 'bold'
    });
    card.add(price); // Добавление цены в контейнер
    
    if (!isOwned) { // Если предмет еще не куплен
        // Кнопка покупки
        const btn = scene.add.graphics(); // Создание графического объекта для кнопки
        btn.fillStyle(0x27ae60, 1); // Зеленый цвет
        btn.fillRoundedRect(240, 35, 90, 40, 8); // Рисование кнопки
        card.add(btn); // Добавление кнопки в контейнер
        
        const btnText = scene.add.text(285, 55, '💳 Купить', { // Создание текста на кнопке
            fontSize: '14px',
            fontFamily: 'Nunito, Arial',
            color: '#ffffff',
            fontStyle: 'bold'
        });
        btnText.setOrigin(0.5); // Центрирование текста
        card.add(btnText); // Добавление текста в контейнер
        
        const btnHit = scene.add.rectangle(285, 55, 90, 40, 0xffffff, 0); // Создание невидимой области клика
        btnHit.setInteractive({ useHandCursor: true }); // Установка интерактивности
        btnHit.on('pointerdown', () => buyEquipment(scene, item)); // При клике покупаем предмет
        card.add(btnHit); // Добавление области в контейнер
    } else { // Если предмет уже куплен
        // Индикатор владения
        const owned = scene.add.text(285, 55, '✅ КУПЛЕНО', { // Создание текста статуса
            fontSize: '14px',

            color: '#ffffff',
            fontStyle: 'bold'
        });
        owned.setOrigin(0.5); // Центрирование
        card.add(owned); // Добавление текста в контейнер
    }
    
    return card; // Возврат созданной карточки
}

function buyEquipment(scene, item) { // Функция покупки снаряжения
    if (gameState.money < item.price) { // Проверка достаточности денег
        showNotification(scene, '❌ Недостаточно денег!', '#e74c3c'); // Показываем сообщение об ошибке
        return; // Выход из функции
    }
    
    gameState.equipment.push(item.id); // Добавляем предмет в инвентарь
    gameState.money -= item.price; // Вычитаем цену
    showNotification(scene, `✅ Куплено: ${item.name}`, '#27ae60'); // Показываем уведомление
    showMoneyAnimation(scene, item.price, false); // Анимация потери денег
    
    scene.updateStatus(); // Обновляем панель статуса
    
    // Перерисовываем окно
    closeModal(scene, currentModal); // Закрываем текущее окно
    setTimeout(() => openEquipmentModal(scene), 200); // Открываем новое окно
}

function openFoodModal(scene) { // Функция открытия окна покупки продовольствия

        // Название и описание
        const name = scene.add.text(-250, -10, foodType.name, { // Создание текста с названием
            fontSize: '18px',
            fontFamily: 'Russo One, Arial',
            color: '#ffffff',
            fontStyle: 'bold'
        });
        card.add(name); // Добавление названия в контейнер
        
        const desc = scene.add.text(-250, 15, foodType.description, { // Создание текста с описанием
            fontSize: '13px',
            fontFamily: 'Nunito, Arial',
            color: '#ecf0f1'
        });
        card.add(desc); // Добавление описания в контейнер
        
        // Цена и качество
        const priceText = scene.add.text(100, 0, `💰 ${formatMoney(foodType.pricePerDay)} / день`, { // Создание текста с ценой

            fontFamily: 'Nunito, Arial',

        priceText.setOrigin(0, 0.5); // Установка точки привязки

        // Звездочки качества

        quality.setOrigin(1, 0.5); // Установка точки привязки справа
        card.add(quality); // Добавление качества в контейнер
        
        // Интерактивная область для выбора

        hitArea.setInteractive({ useHandCursor: true }); // Установка интерактивности
        hitArea.on('pointerdown', () => { // При клике
            gameState.selectedFoodType = foodType.id; // Устанавливаем выбранный тип
            closeModal(scene, currentModal); // Закрываем окно
            setTimeout(() => openFoodModal(scene), 200); // Открываем снова для отображения изменений

        yOffset += 80; // Увеличение смещения для следующей карточки

        yOffset += 20; // Дополнительное смещение

            fontFamily: 'Russo One, Arial',

            const btn = scene.add.container(-200 + index * 110, yOffset); // Создание контейнера для кнопки

                fontSize: '14px',
                fontFamily: 'Russo One, Arial',
                color: '#ffffff'
            });

            btn.add(btnDays); // Добавление текста в контейнер
            
            const btnCost = scene.add.text(0, 10, formatMoney(cost), { // Создание текста со стоимостью
                fontSize: '12px',
                fontFamily: 'Nunito, Arial',

            });
            btnCost.setOrigin(0.5); // Центрирование
            btn.add(btnCost); // Добавление стоимости в контейнер
            
            const btnHit = scene.add.rectangle(0, 0, 100, 60, 0xffffff, 0); // Создание невидимой области клика
            btnHit.setInteractive({ useHandCursor: true }); // Установка интерактивности
            btnHit.on('pointerdown', () => buyFood(scene, days, cost)); // При клике покупаем еду
            btn.add(btnHit); // Добавление области в контейнер
            
            modal.add(btn); // Добавление кнопки в окно
        });
    }
}

function buyFood(scene, days, cost) { // Функция покупки продовольствия
    if (gameState.money < cost) { // Проверка достаточности денег
        showNotification(scene, '❌ Недостаточно денег!', '#e74c3c'); // Показываем сообщение об ошибке
        return; // Выход из функции
    }
    
    gameState.foodDays += days; // Увеличиваем количество дней продовольствия
    gameState.money -= cost; // Вычитаем стоимость
    
    const selectedFood = GAME_DATA.food.find(f => f.id === gameState.selectedFoodType); // Поиск выбранного типа еды
    showNotification(scene, `✅ Куплено ${days} дней ${selectedFood.name}`, '#27ae60'); // Показываем уведомление
    showMoneyAnimation(scene, cost, false); // Анимация потери денег
    
    scene.updateStatus(); // Обновляем панель статуса
    
    closeModal(scene, currentModal); // Закрываем окно
    setTimeout(() => openFoodModal(scene), 200); // Открываем снова
}

    btnHit.on('pointerdown', () => { // При клике
        toggleJob(scene, job); // Переключаем состояние задания
    });
    card.add(btnHit); // Добавление области в контейнер
    
    return card; // Возврат созданной карточки

function toggleJob(scene, job) { // Функция переключения состояния задания
    const isAccepted = gameState.jobs.includes(job.id); // Проверка текущего состояния
    
    if (isAccepted) { // Если задание уже принято
        gameState.jobs = gameState.jobs.filter(id => id !== job.id); // Удаляем из списка
        gameState.cargoUsed -= job.cargoWeight; // Уменьшаем использованный груз
        showNotification(scene, `❌ Отменено: ${job.title}`, '#e74c3c'); // Показываем уведомление
    } else { // Если задание не принято
        if (gameState.cargoUsed + job.cargoWeight > GAME_DATA.maxCargoCapacity) { // Проверка вместимости
            showNotification(scene, '❌ Нет места в трюме для груза!', '#e74c3c'); // Показываем сообщение об ошибке
            return; // Выход из функции
        }
        
        gameState.jobs.push(job.id); // Добавляем задание в список
        gameState.cargoUsed += job.cargoWeight; // Увеличиваем использованный груз
        showNotification(scene, `✅ Принято: ${job.title}`, '#27ae60'); // Показываем уведомление
    }
    
    // Перерисовываем окно
    closeModal(scene, currentModal); // Закрываем текущее окно
    setTimeout(() => openJobsModal(scene), 200); // Открываем новое окно
}

function getRiskColor(level) { // Функция получения цвета в зависимости от уровня риска
    const colors = { 1: 0x27ae60, 2: 0xf39c12, 3: 0xe74c3c }; // Словарь цветов: зеленый, оранжевый, красный
    return colors[level] || 0x4fc3f7; // Возврат цвета или голубого по умолчанию
}

function checkReadyToDepart(scene) { // Функция проверки готовности к отплытию
    const problems = []; // Массив для хранения проблем
    
    // Проверка экипажа
    const requiredCrew = GAME_DATA.crew.filter(m => m.required); // Получение списка обязательных членов
    requiredCrew.forEach(member => { // Цикл по каждому обязательному члену
        if (!gameState.crew.includes(member.id)) { // Если член не нанят
            problems.push(`Нужен ${member.role}: ${member.name}`); // Добавляем проблему в список
        }
    });
    
    if (gameState.crew.length < GAME_DATA.minCrewRequired) { // Проверка минимального количества экипажа
        problems.push(`Мало людей в команде (минимум ${GAME_DATA.minCrewRequired})`); // Добавляем проблему
    }
    
    // Проверка еды
    if (gameState.foodDays < 10) { // Проверка минимального количества продовольствия
        problems.push('Мало продовольствия (минимум на 10 дней)'); // Добавляем проблему
    }
    
    if (problems.length > 0) { // Если есть проблемы
        showProblemModal(scene, problems); // Показываем окно с проблемами
    } else { // Если все готово
        showDepartureModal(scene); // Показываем окно отплытия
    }
}

function formatMoney(amount) { // Функция форматирования денег в строку с разделителями
    return amount.toLocaleString('ru-RU') + ' ₽'; // Форматирование числа в русской локали и добавление символа рубля
}

function darkenColor(color, percent) { // Функция затемнения цвета на заданный процент
    const r = (color >> 16) & 0xFF; // Извлечение красного компонента
    const g = (color >> 8) & 0xFF; // Извлечение зеленого компонента
    const b = color & 0xFF; // Извлечение синего компонента
    
    const factor = (100 - percent) / 100; // Вычисление коэффициента затемнения
    
    const newR = Math.floor(r * factor); // Применение коэффициента к красному
    const newG = Math.floor(g * factor); // Применение коэффициента к зеленому
    const newB = Math.floor(b * factor); // Применение коэффициента к синему
    
    return (newR << 16) | (newG << 8) | newB; // Объединение компонентов обратно в шестнадцатеричное значение
}

function getMoraleEmoji() { // Функция получения эмодзи морали (не используется в текущей версии)
    if (gameState.morale >= 80) return '😊 Отлично'; // Высокая мораль
    if (gameState.morale >= 60) return '🙂 Хорошо'; // Хорошая мораль
    if (gameState.morale >= 40) return '😐 Нормально'; // Средняя мораль
    if (gameState.morale >= 20) return '😟 Плохо'; // Низкая мораль
    return '😢 Ужасно'; // Очень низкая мораль
}

function showMoneyAnimation(scene, amount, isPositive) { // Функция отображения анимации изменения денег
    const color = isPositive ? '#2ecc71' : '#e74c3c'; // Определение цвета (зеленый для прибыли, красный для расхода)
    const prefix = isPositive ? '+' : ''; // Определение префикса (+ для прибыли)
    
    const text = scene.add.text(600, 700, `${prefix}${formatMoney(amount)}`, { // Создание текста с суммой
        fontSize: '24px',
        fontFamily: 'Russo One, Arial',
        color: color,
        stroke: '#000000', // Черная обводка
        strokeThickness: 3 // Толщина обводки
    });
    text.setOrigin(0.5); // Центрирование
    text.setDepth(2000); // Установка глубины отрисовки
    
    scene.tweens.add({ // Создание анимации
        targets: text, // Анимируемый объект
        y: 600, // Конечная Y координата (движение вверх)
        alpha: 0, // Конечная прозрачность (исчезновение)
        duration: 1500, // Длительность анимации
        ease: 'Power2', // Функция плавности
        onComplete: () => text.destroy() // Уничтожение текста после завершения анимации
    });
}

function showNotification(scene, message, color) { // Функция отображения уведомления
    const notification = scene.add.container(600, 100); // Создание контейнера для уведомления
    notification.setDepth(2000); // Установка глубины отрисовки
    
    const bg = scene.add.graphics(); // Создание графического объекта для фона
    bg.fillStyle(parseInt(color.replace('#', '0x')), 0.95); // Установка цвета фона (преобразование из hex)
    bg.fillRoundedRect(-200, -25, 400, 50, 10); // Рисование закругленного прямоугольника
    notification.add(bg); // Добавление фона в контейнер
    
    const text = scene.add.text(0, 0, message, { // Создание текста уведомления
        fontSize: '16px',
        fontFamily: 'Nunito, Arial',
        color: '#ffffff',
        fontStyle: 'bold'
    });
    text.setOrigin(0.5); // Центрирование текста
    notification.add(text); // Добавление текста в контейнер
    
    notification.setAlpha(0); // Установка начальной прозрачности
    notification.y = 50; // Установка начальной Y координаты
    
    // Анимация появления
    scene.tweens.add({ // Создание анимации появления
        targets: notification, // Анимируемый объект
        y: 100, // Конечная Y координата
        alpha: 1, // Конечная прозрачность
        duration: 300, // Длительность
        ease: 'Back.easeOut' // Функция плавности
    });
    
    // Задержка перед исчезновением
    scene.time.delayedCall(2000, () => { // Вызов функции через 2 секунды
        scene.tweens.add({ // Создание анимации исчезновения
            targets: notification, // Анимируемый объект
            y: 50, // Конечная Y координата (движение вверх)
            alpha: 0, // Конечная прозрачность
            duration: 300, // Длительность
            ease: 'Back.easeIn', // Функция плавности
            onComplete: () => notification.destroy() // Уничтожение уведомления после завершения
        });
    });
}
